name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-install:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade "pip>=26.2" build
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"
      - name: Smoke installed CLI, SQLite, and FTS5
        working-directory: ${{ runner.temp }}
        run: |
          gptlog-core --help
          gptlog-core import "${{ github.workspace }}/tests/fixtures/synthetic_chatgpt_export.json" --db "gptlog-ci.sqlite3" --branch all --json
          gptlog-core search "SQLite FTS5" --db "gptlog-ci.sqlite3" --json
          gptlog-core verify --db "gptlog-ci.sqlite3" --json
          python -c "import importlib.metadata as m, gptlog_core; assert m.version('gptlog-core') == gptlog_core.__version__ == '0.1.0'"
